name: Keep API awake

# The Render free instance sleeps after 15 minutes without traffic, and the
# first request after that can take around 50 seconds. This scheduled ping
# keeps the demo responsive between visits. GitHub can delay scheduled runs, so
# it is a convenience, not a guarantee; the client also retries cold-start
# failures and the Messages screen offers a manual retry.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-api-awake
  cancel-in-progress: false

jobs:
  ping:
    name: Ping health endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake the API
        run: |
          curl --fail --silent --show-error \
            --max-time 90 \
            --retry 2 \
            --retry-delay 10 \
            https://murmur-api-i8sv.onrender.com/api/health
