# Render blueprint for the API.
#
# Render reads this file when the repository is connected as a Blueprint. The
# web app is not here: it is a Next.js app and deploys to Vercel, which builds
# it from frontend/ (Root Directory). The API needs a long-lived process and
# WebSockets, which Vercel Functions do not provide.
#
# One instance on purpose: Socket.IO rooms live in the process, so a second
# instance would only see half the sockets. Add the Redis adapter first.
services:
  - type: web
    name: murmur-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Free by default: the demo does not need a paid instance. Free services
    # sleep after 15 minutes idle, so the first request can take ~50 seconds.
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Filled in on the first deploy, then managed in the dashboard.
      - key: MONGO_URI
        sync: false
      # Clerk: the same application the web app uses. The secret key is
      # server-only and must never be given a NEXT_PUBLIC_ name.
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      # Optional. The PEM public key from the Clerk API keys page; with it,
      # session tokens are verified without calling Clerk on each request.
      - key: CLERK_JWT_KEY
        sync: false
      # The web app's origin. It is the only allowed CORS origin, the socket
      # origin, and the default Clerk authorized party.
      - key: CLIENT_URL
        sync: false
      # Comma-separated extra origins (Vercel previews) whose tokens are allowed.
      - key: CLERK_AUTHORIZED_PARTIES
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
