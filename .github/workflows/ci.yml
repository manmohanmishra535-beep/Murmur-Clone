name: CI

# Every push and pull request runs the same checks. On main, a green run also
# publishes the API image and asks the hosts to deploy; that is the "pushing to
# main deploys a tagged build with passing tests" line in the docs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The publish job needs to write to GHCR; everything else is read-only.
permissions:
  contents: read
  packages: write

concurrency:
  # A newer push to the same branch supersedes the old run, except on main,
  # where the deploy of the previous commit is allowed to finish.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # The docs ask for an audit in CI. Production dependencies are clean; a
      # high or critical advisory in one of them fails the build.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # The test suite runs a real MongoDB, downloaded by mongodb-memory-server.
      # It is ~600 MB, so keep it between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}

      - run: npm test

  frontend:
    name: Web tests, lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Dummy origins: the build only needs them to be defined. The deploy
      # pipeline rebuilds with the real ones.
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
      NEXT_PUBLIC_SOCKET_URL: http://localhost:5000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Critical only: Next bundles a postcss version with a high advisory, and
      # the fix is a major Next upgrade (16). That is tracked, not hidden — the
      # report still prints — but it should not turn every build red.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - run: npm test

      - run: npm run lint

      - run: npm run build

  docker:
    name: Images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: murmur-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: murmur-web:ci
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.example.test/api
            NEXT_PUBLIC_SOCKET_URL=https://api.example.test
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  publish:
    name: Publish the API image
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      # GHCR rejects uppercase repository names, and this repo has one.
      - name: Lowercase the image path
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.name }}/api:${{ github.sha }}
            ghcr.io/${{ steps.image.outputs.name }}/api:latest
          cache-from: type=gha,scope=api

  deploy-api:
    name: Deploy the API
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Trigger the Render deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK is not set; skipping the API deploy."
            echo "Add it under Settings -> Secrets and variables -> Actions."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
          echo
          echo "Render was asked to deploy $GITHUB_SHA."

  deploy-web:
    name: Deploy the web app
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Trigger the Vercel deploy hook
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK is not set; skipping."
            echo "Vercel's Git integration already deploys main by itself."
            echo "Set the hook only if this repository should be the trigger."
            exit 0
          fi
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" > /dev/null
          echo "Vercel was asked to deploy $GITHUB_SHA."

  smoke:
    name: Health check
    runs-on: ubuntu-latest
    needs: [deploy-api, deploy-web]
    steps:
      # Both checks are opt-in: a repository that has not been pointed at a
      # deployment yet should still go green rather than fail on nothing.
      - name: GET /api/health
        if: vars.API_URL != ''
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          for attempt in $(seq 1 40); do
            body=$(curl -fsS "$API_URL/api/health" || true)
            if printf '%s' "$body" | grep -q '"status":"ok"'; then
              echo "API healthy: $body"
              exit 0
            fi
            echo "attempt $attempt: ${body:-no answer}"
            sleep 15
          done
          echo "The API did not report healthy within ten minutes."
          exit 1

      - name: GET the web app's login page
        if: vars.WEB_URL != ''
        env:
          WEB_URL: ${{ vars.WEB_URL }}
        run: |
          code=$(curl -fsS -o /dev/null -w '%{http_code}' "$WEB_URL/login")
          echo "GET $WEB_URL/login -> $code"
          test "$code" = "200"
